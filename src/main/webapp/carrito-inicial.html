<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="header">
    <h1>🎨 BodyPaint</h1>
    <p> Pinturas • Pinceles • Insumos Artísticos </p>

    <nav>
        <a href="#">Productos</a>
        <a href="#">Carrito</a>
        <a href="#">Mi Cuenta</a>
    </nav>
</header>

<div class="contenedor">

    <h1>Carrito de Compras</h1>

    <table>
        <tr>
            <th>Producto</th>
            <th>Cantidad</th>
            <th>Precio</th>
            <th>Acción</th>
        </tr>

        <tr>
            <td>Acrílico Alba 500ml</td>
            <td>2</td>
            <td>$1500</td>
            <td><button class="eliminar">Eliminar</button></td>
        </tr>

        <tr>
            <td>Set de Pinceles Sintéticos</td>
            <td>1</td>
            <td>$2200</td>
            <td><button class="eliminar">Eliminar</button></td>
        </tr>
    </table>

    <div class="total">
        Total: $5200
    </div>

</div>

<footer>
    BodyPaint - Proyecto Integrador de Metodología de Sistemas II
</footer>

</body>
</html>
